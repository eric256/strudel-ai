name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Server starts and serves the app
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:3000/api/version
          curl -sf http://127.0.0.1:3000/ | grep -q 'name="app-build"'
          curl -sf -o /dev/null http://127.0.0.1:3000/vendor/strudel/index.js
          kill $! || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
